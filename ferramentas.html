<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mais Ferramentas - Aplicações de IA</title>
    <link rel="icon" href="mackai-logo.png" type="image/png">

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }
        header {
            background-color: #282c34;
            color: white;
            padding: 20px 0;
        }
        h1 {
            margin: 0;
            font-size: 2.5em;
        }
        img {
            width: 100px;
            margin-top: 20px;
        }
        section {
            margin: 50px 0;
        }
        button {
            display: block;
            margin: 15px 0;
            font-size: 1.2em;
            padding: 10px 20px;
            background-color: #282c34;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 15px;
        }
        button:hover {
            background-color: #ff0000;
        }
        .back-button {
            background-color: #580b0f;
            margin-top: 30px;
        }
        .back-button:hover {
            background-color: #df1313;
        }
    </style>
</head>
<body>
    <header>
        <img src="mackai-logo.png" alt="Imagem sobre IA">
        <h1>Mais Ferramentas - Aplicações de IA</h1>
    </header>

    <center>
    <section>
        <!-- Botões para acessar diretamente as ferramentas -->
        <button onclick="window.open('https://www.canva.com/', '_blank')">Canva - Apresentação e Imagem</button>

        <button onclick="window.open('https://chatgpt.com/', '_blank')">ChatGPT - Imagem e Texto</button>

        <button onclick="window.open('https://copilot.microsoft.com/', '_blank')">Copilot - Imagem e Texto</button>

        <button onclick="window.open('https://www.artbreeder.com/', '_blank')">Artbreeder - Imagem</button>

        <button onclick="window.open('https://deepdreamgenerator.com/', '_blank')">Deepdreamgenerator - Imagem</button>

        <button onclick="window.open('https://soundraw.io/', '_blank')">Soundraw - Áudio</button>
        

        <!-- Botão de Voltar -->
        <button class="back-button" onclick="window.location.href='index.html'">Voltar para Página Inicial</button>
    </section>
    </center>
</body>
</html>
